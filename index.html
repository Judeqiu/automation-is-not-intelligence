<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>越界播客 · CastPages</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel-bg: #111118;
    --border: #1e1e2e;
    --text: #c8c8d4;
    --text-dim: #6a6a7a;
    --accent: #4a9eff;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    padding: 64px 32px 40px;
    text-align: center;
  }
  .header .brand {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    margin-top: 12px;
    font-size: 16px;
    color: var(--text-dim);
  }
  .page-list {
    width: 100%;
    max-width: 720px;
    padding: 0 32px 64px;
  }
  .page-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 24px;
    margin-bottom: 12px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    transition: border-color 0.2s;
  }
  .page-card:hover { border-color: var(--accent); }
  .page-card .ep-badge {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(74,158,255,0.1);
    border: 1px solid rgba(74,158,255,0.2);
    border-radius: 12px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  .page-card .info { flex: 1; }
  .page-card .title {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
  }
  .page-card .desc {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .page-card .arrow {
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 20px;
  }
  .footer {
    margin-top: auto;
    padding: 32px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">越界播客</div>
  <h1>CastPages</h1>
  <div class="subtitle">现场演示页面 · 每集一个对比，每次看见智能的边界</div>
</div>

<div class="page-list">
  <a href="/CastPages/ep3-quantum-entanglement.html" class="page-card">
    <div class="ep-badge">EP3</div>
    <div class="info">
      <div class="title">量子纠缠 · 解释 vs 解构</div>
      <div class="desc">向普通人解释一个科学概念 — 框架化分析把"讲清楚"变成了"拆解清楚"。比分 24:59。</div>
    </div>
    <div class="arrow">→</div>
  </a>
  <a href="/CastPages/ep2-automation-vs-intelligence.html" class="page-card">
    <div class="ep-badge">EP2</div>
    <div class="info">
      <div class="title">Automation ≠ Intelligence</div>
      <div class="desc">外置 Workflow vs 内化判断 — AI是否替代人类？两种分析方式，独立 Agent 盲评谁更优。</div>
    </div>
    <div class="arrow">→</div>
  </a>
</div>

<div class="footer">
  越界播客 · 看见下一步的人
</div>

</body>
</html>
